# What cargo-atlas's map of ripgrep 15.1.0 (commit af60c2d) must hold.
# bench/drift_check.py compares a fresh map with this file, and
# .github/workflows/drift.yml runs it every night.
#
# Every link below was read against the code on 2026-11-16, in a map built
# with rust-analyzer 2026-07-06 (commit 7ae18ed) and Rust 1.97.0 with rust-src.
# When the check fails: list what changed with bench/diff_graphs.py, read each
# change against the code, then update this file.

workspace = "ripgrep 15.1.0"
checked = "2026-11-16"
rust_analyzer = "2026-07-06"
format_version = 4

[counts]
items = 4130               # every node
links = 21504              # every edge
exact_calls = 5947         # function to function, EXACT, one per pair: bench/README.md
candidates = 4411          # may_call: impls a call through a trait may reach
syntax_calls = 21          # calls in macro_rules! bodies, all 21 read against the code
outside_trait_impls = 108  # impls of traits from std and other crates, EXACT
name_only_traits = 0       # traits from outside the workspace known only by name
tests = 429                # functions marked as tests
unsafe_sites = 5
targets = 19               # 9 lib, 4 test, 3 example, 1 bench, 1 bin, 1 build script

